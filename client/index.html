<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- 🌟 Browser Tab Title -->
  <title>Klase | Hangout Space</title>

  <!-- 1. Browser Tab Favicons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- 2. Core Open Graph (OG) Meta Tags for Social Preview Cards -->
  <!-- 🌟 Social Link Card Title -->
  <meta property="og:title" content="Klase | Hangout Space" />
  <meta property="og:description" content="Explore my Vite + Three.js 3D web experience." />
  <meta property="og:url" content="https://klase-tan.vercel.app/" />
  <meta property="og:image" content="https://vercel.app" />
  <meta property="og:type" content="website" />

  <!-- 3. Twitter/X Card Layout Options (Recommended for square logos) -->
  <meta name="twitter:card" content="summary" />
  <!-- 🌟 Twitter Card Title -->
  <meta name="twitter:title" content="Klase | Hangout Space" />
  <meta name="twitter:description" content="Explore my Vite + Three.js 3D web experience." />
  <meta name="twitter:image" content="https://vercel.app" />

  <!-- 4. Third-Party Font Connections & External CDNs -->
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <script src="https://cloudflare.com"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
