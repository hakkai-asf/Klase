<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- 🌟 Browser Tab Title -->
  <title>Klase | Hangout Space</title>

  <!-- 1. Browser Tab Favicons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- 2. Core Open Graph (OG) Meta Tags for Facebook Messenger -->
  <meta property="og:title" content="Klase | Hangout Space" />
  <meta property="og:description" content="Explore a 3D Virtual Classroom Hangout Space." />
  <meta property="og:url" content="https://klase-room.vercel.app/" />
  <meta property="og:type" content="website" />

  <!-- 🛠️ FIXED: Now links to your actual live orange preview banner -->
  <meta property="og:image" content="https://vercel.app" />
  <!-- Explicit dimensions so Messenger can render it instantly -->
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />

  <!-- 3. Twitter/X Card Layout Options -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Klase | Hangout Space" />
  <meta name="twitter:description" content="Explore a 3D Virtual Classroom Hangout Space." />
  <!-- 🛠️ FIXED: Links to your live orange preview banner for Twitter/X too -->
  <meta name="twitter:image" content="https://vercel.app" />

  <!-- 4. Third-Party Font Connections & External CDNs -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <script src="https://cloudflare.com"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
